name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Check for unreplaced template placeholders
        id: placeholder-check
        run: |
          if grep -q '{{' composer.json; then
            echo "unscaffolded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::composer.json still contains {{ }} template placeholders; skipping Composer validation until the plugin is scaffolded."
          else
            echo "unscaffolded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Composer dependencies
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        run: composer run phplint

      - name: PHP coding standards
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        run: composer run phpcs
